services:
  frontend:
    image: ghcr.io/husni-robani/abstracted_self-frontend:${TAG:-latest}
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  backend:
    image: ghcr.io/husni-robani/abstracted_self-backend:${TAG:-latest}
    build: ./backend
    ports:
      - "8080:8080" # Only for developement, in order to backend API can accessed through localhost directly
    environment:
      - RUNNING_IN_DOCKER=true
    env_file:
      - path: ./backend/.env.docker
        required: true
      - path: ./backend/.env.access_credentials
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:15.12-alpine3.21
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secret}
      - POSTGRES_DB=${DB_NAME:-abstracted_self}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # mount files explicitly: mounting the whole dir would also execute
      # seed_rollback.sql on fresh init and wipe the seed immediately
      - ./postgres-init/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./postgres-init/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-abstracted_self}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  backend_storage:
  pgdata:
