services:
  frontend:
    image: ghcr.io/husni-robani/abstracted_self-frontend:${TAG:-latest}
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "80:80"
      - "443:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  backend:
    image: ghcr.io/husni-robani/abstracted_self-backend:${TAG:-latest}
    build: ./backend
    # ports: | has no ports that listen to the host, it since frontend-backend 
    # communication happened through docker network, so it doesn't need any ports that listen to the host
    environment:
      - RUNNING_IN_DOCKER=true
    env_file:
      - path: ./backend/.env.docker
        required: true
      - path: ./backend/.env.access_credentials
        required: false
    volumes:
      - backend_storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  backend_storage:
