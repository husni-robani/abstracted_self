services:
  frontend:
    image: ghcr.io/husni-robani/abstracted_self-frontend:${TAG:-latest}
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--no-check-certificate", "https://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
    # TLS/SSL certificate and private-key in production server
      - /etc/nginx/certs/cloudflare-husnirb_dev-tls-certificate.pem:/etc/nginx/certs/fullchain.pem:ro
      - /etc/nginx/certs/cloudflare-husnirb_dev-private-key.pem:/etc/nginx/certs/privkey.pem:ro

  backend:
    image: ghcr.io/husni-robani/abstracted_self-backend:${TAG:-latest}
    build:
      context: ./backend
      target: production
    # ports: | has no ports that listen to the host, since the web-server nginx will redirect to backend:8080 (through docker network) 
    # communication happened through docker network, so it doesn't need any ports that listen to the host
    environment:
      - RUNNING_IN_DOCKER=true
    env_file:
      - path: ./backend/.env.docker
        required: true
      - path: ./backend/.env.access_credentials
        required: false
    volumes:
      - backend_storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  backend_storage:
