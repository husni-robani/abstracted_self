name: CD

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: self-hosted
    env:
      TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write prod env files from secrets
        run: |
          printf '%s' "${{ secrets.ENV_DOCKER_PROD }}" > backend/.env.docker
          printf '%s' "${{ secrets.ENV_ACCESS_PROD }}" > backend/.env.access_credentials

      - name: Build & start compose
        run: |
          docker compose -f docker-compose.prod.yml build
          docker compose -f docker-compose.prod.yml up -d --wait

      - name: Healthcheck
        id: health
        run: |
          for i in $(seq 1 12); do
            if wget -qO- http://127.0.0.1:8080/healthz 2>/dev/null | grep -q ok; then
              echo "healthy=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "waiting... $i"
            sleep 5
          done
          echo "healthy=false" >> $GITHUB_OUTPUT

      - name: Report result
        run: |
          if [ "${{ steps.health.outputs.healthy }}" = "true" ]; then
            echo "✅ Deploy ${{ env.TAG }} successful"
          else
            echo "⚠️ Deploy ${{ env.TAG }} unhealthy — SSH into VPS and run: docker compose -f docker-compose.prod.yml down && docker compose -f docker-compose.prod.yml up -d"
          fi